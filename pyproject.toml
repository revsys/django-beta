[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-beta"
version = "0.2.0"
description = "django-beta is a reusable Django application for handling pre-beta signups."
authors = [
    { name = "Frank Wiles", email = "frank@revsys.com" },
    { name = "Jeff Triplett", email = "jeff@revsys.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = []
requires-python = ">=3.10"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/revsys/django-beta/"

[project.optional-dependencies]
lint = ["prek"]
test = ["pytest", "pytest-cov", "pytest-django"]
testing = ["django-beta[test]"]

[tool.bumpver]
current_version = "0.2.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']

[tool.coverage.paths]
source = ["beta"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if DEBUG:",
    "if not DEBUG:",
    "if settings.DEBUG:",
    "if TYPE_CHECKING:",
    'def __str__\(self\)\s?\-?\>?\s?\w*\:',
]

[tool.coverage.run]
omit = [
    "test_project/*",
]
source = ["beta"]

[tool.hatch.build.targets.wheel]
packages = ["beta"]

[tool.hatch.build.targets.sdist]
include = [
    "/beta",
    "/README.md",
]

[tool.isort]
profile = "black"
honor_noqa = true

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Django declares these as plain class attributes by convention; ClassVar
# annotations would be wrong here (migrations are generated code).
"**/migrations/*.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/models.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_project.settings"
addopts = "--reuse-db"
norecursedirs = ".* build dist docs .eggs/* *.egg-info htmlcov beta .git .tox"
python_files = "test*.py *_tests.py"
pythonpath = ["test_project"]
testpaths = ["test_project"]
